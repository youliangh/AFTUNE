[project]
name = "aftune"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.10.1",
    "aftune-torch",
    "blake3==1.0.8",
    "datasets==4.3.0",
    "ninja>=1.13.2",
    "setuptools>=84.2.1",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tqdm==4.67.1",
    "transformers==5.5.4",
    "wheel>=0.48.0",
    "zstandard==0.25.0",
]

[tool.uv]
cache-dir = "../.cache/uv"
no-build-isolation-package = ["aftune-torch"]

[tool.uv.sources]
aftune-torch = { path = "aftune_hash" }
